name: Python Tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "scripts/bootstrap.sh"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "scripts/bootstrap.sh"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

env:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  POETRY_VERSION: "2.4.1"
  POETRY_VIRTUALENVS_CREATE: "true"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"

      - name: Validate bootstrap CLI
        run: |
          bash -n scripts/bootstrap.sh
          bash scripts/bootstrap.sh --help

      - name: Install locked standalone runtime
        run: bash scripts/bootstrap.sh "$(command -v python)"

      - name: Verify existing virtualenv is preserved
        run: |
          original_python="$(poetry env info --executable)"
          bash scripts/bootstrap.sh
          test "$original_python" = "$(poetry env info --executable)"
          poetry run python -c 'import sys; assert sys.version_info[:2] == tuple(map(int, "${{ matrix.python-version }}".split(".")))'

      - name: Validate FastMCP CLI
        run: poetry run fastmcp --help

      - name: Run unit tests
        run: poetry run python -m unittest discover -s tests -v